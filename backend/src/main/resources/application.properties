spring.application.name=spire-backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spire_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:spire_user}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}

jwt.secret=${JWT_SECRET:defaultSecretKeyThatShouldBeChangedInProduction0123456789}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholder_secret}

cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Mail (Gmail SMTP). When MAIL_USERNAME/MAIL_PASSWORD are blank,
# EmailService treats the system as "not configured" and silently
# skips every send so signups still work in local dev without
# leaking the noreply address into people's inboxes. App URL is
# the canonical site origin used in verification / reset / share
# links — env-overridable so staging picks up its own domain.
#
# Connection mode: implicit SSL on port 465 (SMTPS). Switched off
# STARTTLS / 587 because Railway's egress was hanging the upgrade
# handshake; 465 negotiates TLS at connect time so there's no
# plaintext window to fail in. socketFactory.* keep JavaMail
# happy when starttls is off — without them the connection falls
# back to plain SMTP which Gmail rejects.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.from=${MAIL_FROM:noreply@spireinfotech.com}
app.url=${APP_URL:https://spireinfotech.vercel.app}

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Serialize timestamps in IST so the frontend doesn't need a per-call
# timezone conversion. The DB still stores UTC (LocalDateTime stays
# tz-naive) — Jackson rebases on the way out. Combined with the
# frontend's formatIST helpers (defensive, in case any payload comes
# from elsewhere) every visible timestamp lands in Asia/Kolkata.
spring.jackson.time-zone=Asia/Kolkata

logging.level.com.spire.backend.security=INFO