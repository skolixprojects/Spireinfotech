spring.application.name=spire-backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spire_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:spire_user}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}

# Gates the DataSeeder CommandLineRunner. Leave false on the first
# boot against a fresh DB so Hibernate can create tables cleanly;
# flip SEEDER_ENABLED=true on a redeploy once the schema exists to
# run role / user / column-backfill seeding.
seeder.enabled=${SEEDER_ENABLED:false}

jwt.secret=${JWT_SECRET:defaultSecretKeyThatShouldBeChangedInProduction0123456789}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# ── Mail module (internal mail system) ───────────────────────────
# Parallel mail auth — a SEPARATE secret from JWT_SECRET so an LMS
# token can never be replayed as a mail token (or vice-versa).
# Expirations mirror the LMS: access 15 min, refresh 7 days. The
# must-change-password flow uses a single-use DB token (15 min TTL,
# in code), not a JWT.
mail.jwt-secret=${MAIL_JWT_SECRET:defaultMailSecretKeyThatShouldBeChangedInProduction9876543210}
mail.access-token-expiration=900000
mail.refresh-token-expiration=604800000
# Env-guarded bootstrap of the first mail SUPER_ADMIN. Leave
# seed-admin false in normal operation; flip SEED_MAIL_ADMIN=true
# with MAIL_ADMIN_EMAIL/PASSWORD set for ONE boot, then flip back.
mail.seed-admin=${SEED_MAIL_ADMIN:false}
mail.admin-email=${MAIL_ADMIN_EMAIL:}
mail.admin-password=${MAIL_ADMIN_PASSWORD:}
mail.admin-entity=${MAIL_ADMIN_ENTITY:}
# Validity of admin-issued one-time SETUP / RESET links (hours);
# distinct from the 15-min must-change CHANGE token.
mail.link-expiry-hours=${MAIL_LINK_EXPIRY_HOURS:72}
# Max attachment upload size in bytes (default 25 MB). Attachments are
# stored in a private S3 bucket in prod (see mail.s3.* below); with no
# bucket configured, a local-disk fallback is used for dev/test.
mail.attachment-max-bytes=${MAIL_ATTACHMENT_MAX_BYTES:26214400}
# Mail attachment storage (S3). When mail.s3.bucket is set, mail attachments
# use S3 (private bucket; downloads still stream through the walled proxy —
# no presigned URLs). Leave unset for the local-disk dev fallback. Credentials
# come from the default AWS chain (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY);
# region from mail.s3.region (AWS_REGION) or the default region chain. This is
# independent of the LMS Cloudinary config (cloudinary.* above).
mail.s3.bucket=${AWS_S3_BUCKET:}
mail.s3.region=${AWS_REGION:}

razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholder_secret}

cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

email.relay.url=${EMAIL_RELAY_URL:}
email.relay.secret=${EMAIL_RELAY_SECRET:}
app.url=${APP_URL:https://spireinfotech.vercel.app}

agreement.cron.secret=${AGREEMENT_CRON_SECRET:}

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

spring.jackson.time-zone=Asia/Kolkata

logging.level.com.spire.backend.security=INFO

# ── Brand configuration ──────────────────────────────────────────
# Defaults match the original Spire Info Tech deployment. Override
# any of these on Railway (BRAND_* env vars) for a different brand.
brand.name=${BRAND_NAME:Spire Info Tech}
brand.short-name=${BRAND_SHORT_NAME:Spire}
brand.legal-name=${BRAND_LEGAL_NAME:Spire Info Tech}
brand.tagline=${BRAND_TAGLINE:Advance your career with expert coaching and personalized guidance}
brand.contact-email=${BRAND_CONTACT_EMAIL:info@spireitco.com}
brand.support-email=${BRAND_SUPPORT_EMAIL:support@spireitco.com}
brand.noreply-email=${BRAND_NOREPLY_EMAIL:noreply@spireitco.com}
brand.address-line1=${BRAND_ADDRESS_LINE1:H No. 2-91/5, Flat No. 1605}
brand.address-line2=${BRAND_ADDRESS_LINE2:Trendset Jayabheri Enclave, Hitech City}
brand.city=${BRAND_CITY:Hyderabad}
brand.state=${BRAND_STATE:Telangana}
brand.postal-code=${BRAND_POSTAL_CODE:500084}
brand.country=${BRAND_COUNTRY:India}
brand.website=${BRAND_WEBSITE:https://spireinfotech.vercel.app}
brand.id-prefix=${BRAND_ID_PREFIX:SIT}
brand.primary-color=${BRAND_PRIMARY_COLOR:#0F766E}
brand.primary-color-dark=${BRAND_PRIMARY_COLOR_DARK:#115E59}
brand.letterhead-path=${BRAND_LETTERHEAD_PATH:templates/letterhead.pdf}
brand.logo-url=${BRAND_LOGO_URL:https://spireinfotech.vercel.app/logo.png}